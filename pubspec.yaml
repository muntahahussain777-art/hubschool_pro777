name: hubschool_pro
description: HubSchool Pro - The World's Most Advanced Offline-First School ERP
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI / Charts
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # PDF / Printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # Thermal Print (Bluetooth)
  esc_pos_utils_plus: ^2.0.3
  blue_thermal_printer: ^1.1.3

  # Biometric Auth
  local_auth: ^2.3.0

  # Encryption + Secure Storage
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Connectivity + Background Sync
  connectivity_plus: ^6.0.5
  workmanager: 0.9.0

  # Voice / Speech
  speech_to_text: ^7.0.0

  # WhatsApp / URL launcher
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  share_plus: ^12.0.1
  image_picker: ^1.1.2
  image: ^4.0.0
  supabase_flutter: ^2.12.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/hubschoolpro.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icons/hubschoolpro.png"
