<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hubschool_pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: copy assets/icons/hubschoolpro.png to web/icons/hubschoolpro.png for browser tab icon -->
  <link rel="icon" type="image/png" href="icons/hubschoolpro.png"/>
  <link rel="apple-touch-icon" href="icons/hubschoolpro.png">

  <title>HubSchool Pro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      color: #e0e0e0; font-family: system-ui, sans-serif; z-index: 9999;
    }
    #loading h1 { font-size: 1.5rem; margin: 0 0 1rem 0; font-weight: 600; }
    #loading .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #4a9eff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>HubSchool Pro</h1>
    <p>Loading…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function hideLoading() {
        var loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
      }, 5000);
    });
    document.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
